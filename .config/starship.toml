# Starship prompt — https://starship.rs
# Replaces the promptline.vim-generated .shell_prompt.sh.
# Colors come from the terminal theme (Gruvbox Dark via ghostty config),
# so the prompt adapts to any light/dark background automatically.

add_newline = false

[directory]
# Match the old prompt's habit: show at most 3 path segments.
truncation_length = 3
truncation_symbol = "…/"

[cmd_duration]
min_time = 2000

[git_branch]
format = "on [$symbol$branch]($style) "

# spell out the working-tree state with counts, e.g. [+1 !3 ?2 ⇡1]
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = "+$count"
modified = "!$count"
untracked = "?$count"
deleted = "✘$count"
stashed = ""
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"

# docker context, when the dir has a Dockerfile/compose and context isn't default
[docker_context]
format = "via [$symbol$context]($style) "

# active GCP project (more useful and less leaky than the account email)
[gcloud]
format = 'on [$symbol$project]($style) '
symbol = "☁️ "
