# Starship prompt — https://starship.rs
# Replaces the promptline.vim-generated .shell_prompt.sh.
# Colors come from the terminal theme (Gruvbox Dark via ghostty config),
# so the prompt adapts to any light/dark background automatically.

add_newline = false

# clock at the right margin: when each prompt appeared; the gap between two
# timestamps is the wall time from one command to the next
right_format = "$time"

# language/file detection scan budget per prompt; the 30ms default times out
# (with a warning) in big working trees like zipper's
scan_timeout = 120

# statusline inside Claude Code: model, dir, git, context gauge, session cost
# (used by "starship statusline claude-code", see ~/.claude/settings.json)
[profiles]
claude-code = "$claude_model$directory$git_branch$git_status$claude_context$claude_cost"

[directory]
# Show the last two folders, current folder always in full.
truncation_length = 2
truncation_symbol = "…/"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M:%S"
style = "dimmed"

# how long the previous command ran; shows for anything over half a second
[cmd_duration]
min_time = 500
show_milliseconds = true

[git_branch]
format = "on [$symbol$branch]($style) "

# spell out the working-tree state with counts, e.g. [+1 !3 ?2 ⇡1]
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
staged = "+$count"
modified = "!$count"
untracked = "?$count"
deleted = "✘$count"
stashed = ""
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"

# docker context, when the dir has a Dockerfile/compose and context isn't default
[docker_context]
format = "via [$symbol$context]($style) "

# active GCP project (more useful and less leaky than the account email)
[gcloud]
format = 'on [$symbol$project]($style) '
symbol = "☁️ "
